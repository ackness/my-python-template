[project]
name = "my-python-template"
version = "0.1.0"
description = "A Python project template powered by mise, uv, Ruff, and Pyrefly."
dependencies = []
readme = "README.md"
requires-python = ">=3.14"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[project.scripts]
my-python-template = "my_python_template.run:main"

[dependency-groups]
dev = [
    "pyrefly>=1.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 128
cache-dir = ".cache/ruff"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "T20"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/my_python_template/run.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".cache/pytest"
addopts = ["--import-mode=importlib", "-ra"]
filterwarnings = ["error"]

[tool.pyrefly]
project-includes = ["src", "tests"]
